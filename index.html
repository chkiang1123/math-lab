<style>/* ==================== Fraction Lab styles ==================== */
:root {
  --bg: #0d1117; --bg2: #141a23; --card: #182029; --card2: #1f2937;
  --fg: #e9eef6; --fg2: #94a3b8; --line: #2b3644;
  --acc: #6366f1; --acc2: #2dd4bf; --ok: #34d399; --bad: #fb7185; --warn: #fbbf24;
  --radius: 16px;
}
[data-theme="light"] {
  --bg: #f3f6fb; --bg2: #ffffff; --card: #ffffff; --card2: #eef2f9;
  --fg: #17212f; --fg2: #5a6b82; --line: #dbe3ef;
  --acc: #4f46e5; --acc2: #0d9488; --ok: #059669; --bad: #e11d48; --warn: #b45309;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang HK", "Helvetica Neue", Arial, sans-serif;
  line-height: 1.58; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--acc2); text-decoration: none; }
strong { color: var(--fg); }
h1, h2, h3 { line-height: 1.25; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 11px 20px; background: var(--bg2);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; color: var(--fg); letter-spacing: .2px; flex-shrink: 0; }
.topnav { display: flex; gap: 3px; flex: 1; overflow-x: auto; }
.navlink { padding: 7px 13px; border-radius: 10px; color: var(--fg2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.navlink:hover { color: var(--fg); background: var(--card2); }
.navlink.active { color: var(--fg); background: var(--card2); }
.topright { display: flex; align-items: center; gap: 8px; }
.chip { background: var(--card2); border: 1px solid var(--line); padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; color: var(--acc2); white-space: nowrap; }
.theme-btn { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; cursor: pointer; font-size: 14px; color: var(--fg); }
.theme-btn:hover { border-color: var(--acc); }

/* ---------- layout ---------- */
.content { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
.foot { max-width: 1000px; margin: 0 auto; padding: 16px 20px 34px; color: var(--fg2); font-size: 12px; border-top: 1px solid var(--line); }

/* ---------- buttons ---------- */
.btn {
  background: var(--card2); color: var(--fg); border: 1px solid var(--line);
  padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: transform .06s, filter .15s, border-color .15s;
  font-family: inherit;
}
.btn:hover { filter: brightness(1.12); border-color: var(--acc); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn.teal { background: var(--acc2); border-color: var(--acc2); color: #05231f; }
.btn.big { font-size: 16.5px; padding: 13px 24px; }
.btn.small { padding: 7px 13px; font-size: 13.5px; }
.btn.ghost { background: transparent; }
.btn.yes { border-color: var(--ok); color: var(--ok); background: transparent; }
.btn.no { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.hint { border-color: var(--warn); color: var(--warn); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; filter: none; border-color: var(--line); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* ---------- hero / home ---------- */
.hero { padding: 26px 0 6px; }
.hero h1 { font-size: 33px; margin: 0 0 10px; }
.hero-sub { color: var(--fg2); font-size: 17px; max-width: 640px; margin: 0 0 18px; }
@media (max-width: 700px) { .hero h1 { font-size: 26px; } .hero-sub { font-size: 15.5px; } }
.home-ring { text-align: center; color: var(--fg2); font-size: 13px; margin: 6px 0 4px; }
.home-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
@media (max-width: 760px) { .home-cols { grid-template-columns: 1fr; } }
.how { margin-top: 22px; }
.how ol { color: var(--fg2); padding-left: 22px; margin: 8px 0 0; }
.how li { margin-bottom: 5px; }
.how li b { color: var(--fg); }

/* ---------- cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.card h2 { margin: 2px 0 10px; font-size: 18px; }
.list-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; border-radius: 11px; color: var(--fg); }
.list-row:hover { background: var(--card2); }
.list-row .ic { font-size: 20px; margin-top: 1px; flex-shrink: 0; }
.list-row small { color: var(--fg2); font-size: 13px; }
.list-row .nm { font-weight: 700; font-size: 14.5px; }

/* ---------- level pills ---------- */
.set-lvl { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px; letter-spacing: .3px; }
.lvl1 { background: color-mix(in srgb, var(--acc2) 18%, transparent); color: var(--acc2); }
.lvl2 { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* ---------- learn ---------- */
.page-title { font-size: 26px; margin: 4px 0 4px; }
.backlink { font-size: 14px; font-weight: 600; }
.page-sub { color: var(--fg2); margin-top: 2px; }
.learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; margin-top: 16px; }
.learn-card { display: block; color: var(--fg); transition: transform .1s, border-color .15s; }
.learn-card:hover { transform: translateY(-2px); border-color: var(--acc); }
.learn-card h3 { margin: 8px 0 6px; font-size: 16.5px; }
.learn-card p { color: var(--fg2); font-size: 13.5px; margin: 0 0 8px; }
.learn-ic { font-size: 26px; }
.learn-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
.note-h { color: var(--acc2); margin: 22px 0 2px; font-size: 16px; }
.note-p { color: var(--fg); margin: 4px 0; }
.note-p.muted { color: var(--fg2); }
.formula {
  background: var(--card2); border: 1px solid var(--line); border-left: 4px solid var(--acc2);
  padding: 12px 18px; border-radius: 11px; font-size: 18px; margin: 10px 0; overflow-x: auto;
}
.example { background: var(--card2); border-radius: 11px; padding: 12px 16px; margin: 12px 0; border: 1px solid var(--line); }
.ex-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .9px; color: var(--acc2); margin-bottom: 5px; }

/* ---------- practice grid ---------- */
.prac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 18px; }
.set-card { display: block; color: var(--fg); transition: transform .1s, border-color .15s; }
.set-card:hover { transform: translateY(-2px); border-color: var(--acc); }
.set-card h3 { margin: 6px 0 6px; font-size: 16.5px; }
.set-card p { color: var(--fg2); font-size: 13.5px; margin: 0 0 10px; }
.set-meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--fg2); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-top: 16px; }
.qcell { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px; color: var(--fg); font-weight: 700; font-size: 15px; text-align: left; cursor: pointer; font-family: inherit; }
.qcell:hover { border-color: var(--acc); }
.qcell.done { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.qcell.tried { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.qn { display: block; margin-bottom: 5px; }
.mini-preview { display: block; font-weight: 400; font-size: 12.5px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.mid { background: color-mix(in srgb, var(--acc2) 16%, transparent); color: var(--acc2); }
.badge.bad { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

/* ---------- question view ---------- */
.qwrap { max-width: 800px; margin: 0 auto; }
.crumb { color: var(--fg2); font-size: 13.5px; margin-bottom: 10px; }
.qcard { padding: 26px 30px; }
@media (max-width: 620px) { .qcard { padding: 20px 17px; } }
.skill-tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .4px; color: var(--acc2); background: color-mix(in srgb, var(--acc2) 14%, transparent); padding: 4px 11px; border-radius: 99px; margin-bottom: 12px; }
.sim-banner { background: color-mix(in srgb, var(--acc) 16%, transparent); border: 1px solid var(--acc); padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 14.5px; }
.retry-banner { background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); padding: 9px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 14px; }
.qtext { margin: 8px 0 6px; }
.qctx { color: var(--fg2); font-size: 15.5px; margin: 0 0 10px; }
.qdir { font-size: 15.5px; margin: 0 0 4px; }
.qmath { font-size: 1.5em; margin: 12px 0 6px; overflow-x: auto; padding: 3px 0; }
.answer-zone { margin-top: 16px; }

/* answer inputs */
.mcq-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 620px) { .mcq-list { grid-template-columns: 1fr; } }
.mcq-opt { text-align: left; background: var(--card2); border: 1.5px solid var(--line); color: var(--fg); padding: 13px 16px; border-radius: 12px; cursor: pointer; font-size: 16px; font-family: inherit; }
.mcq-opt:hover:not(:disabled) { border-color: var(--acc); }
.mcq-opt:disabled { cursor: default; }
.mcq-opt.picked-wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.mcq-opt.reveal-ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.opt-letter { font-weight: 800; color: var(--acc2); margin-right: 9px; }
.ans-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.textin-box { display: flex; flex-direction: column; gap: 9px; max-width: 600px; }
.ans-in { padding: 12px 15px; font-size: 17px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg2); color: var(--fg); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; width: 100%; }
.ans-in:focus { outline: none; border-color: var(--acc); }
.preview { min-height: 46px; background: var(--card2); border: 1px dashed var(--line); border-radius: 11px; padding: 9px 14px; font-size: 15px; color: var(--fg2); display: flex; align-items: center; }
.tips { font-size: 12.5px; color: var(--fg2); margin-top: 4px; }

/* hints & feedback */
.hint-zone { margin-top: 4px; }
.hint { background: color-mix(in srgb, var(--warn) 9%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); padding: 10px 14px; border-radius: 12px; margin: 8px 0; font-size: 15px; animation: pop .22s; }
.feedback { margin-top: 12px; }
.fb { border-radius: 14px; padding: 16px 18px; animation: pop .22s; }
.fb-ok { background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
.fb-bad { background: color-mix(in srgb, var(--bad) 8%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.fb-title { font-weight: 800; font-size: 16.5px; margin-bottom: 3px; }
.fb-sub { color: var(--fg2); font-size: 13.5px; margin: 8px 0 0; }
.fb-ans { margin-top: 10px; font-size: 17px; }
@keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* steps */
.step-zone { margin-top: 14px; }
.steps-box { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.steps-title { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--acc2); margin-bottom: 6px; }
.step { border-left: 3px solid var(--acc); padding: 6px 0 6px 14px; margin: 10px 0; animation: pop .22s; }
.step-note { color: var(--fg2); font-size: 13.5px; }

/* progress dots */
.setbar { display: flex; gap: 7px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.dot { width: 31px; height: 31px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--card2); border: 1px solid var(--line); color: var(--fg2); }
.dot:hover { border-color: var(--acc); color: var(--fg); }
.dot.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-color: var(--ok); }
.dot.tried { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
.dot.cur { border-color: var(--acc); color: var(--fg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 40%, transparent); }

/* ---------- progress page ---------- */
.prog-top { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0; }
@media (max-width: 720px) { .prog-top { grid-template-columns: repeat(2, 1fr); } }
.stat { text-align: center; background: var(--card2); border: 1px solid var(--line); border-radius: 13px; padding: 14px 8px; }
.stat-num { font-size: 30px; font-weight: 800; color: var(--acc2); }
.stat-lbl { color: var(--fg2); font-size: 12.5px; }
.skill-row { display: grid; grid-template-columns: 210px 1fr 84px; gap: 12px; align-items: center; padding: 7px 0; }
@media (max-width: 620px) { .skill-row { grid-template-columns: 1fr; gap: 2px; } }
.skill-name { font-size: 14px; }
.skill-val { font-size: 12.5px; color: var(--fg2); text-align: right; }
progress { width: 100%; height: 9px; -webkit-appearance: none; appearance: none; border: none; border-radius: 99px; overflow: hidden; background: var(--card2); }
progress::-webkit-progress-bar { background: var(--card2); border-radius: 99px; }
progress::-webkit-progress-value { background: linear-gradient(90deg, var(--acc), var(--acc2)); border-radius: 99px; }
progress::-moz-progress-bar { background: var(--acc2); border-radius: 99px; }

/* ---------- math ---------- */
.katex { font-size: 1.06em; }
.qmath .katex { font-size: 1.02em; }
.math-display { margin: 12px 0; overflow-x: auto; padding: 2px 0; }
.math-display .katex-display { margin: 6px 0; }
.formula .katex { font-size: 1.05em; }
.katex-error { color: var(--bad); font-family: ui-monospace, monospace; font-size: .9em; }

/* ==========================================================================
   Identity chapter — widgets that only it uses
   (the merged sheet is built on the Fraction Lab design tokens, so these
   reuse the same variables rather than introducing new ones)
   ========================================================================== */

/* "find the constants" questions: A = ___, B = ___ */
.const-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.const-lab { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.const-in {
  width: 92px; padding: 10px 12px; font-size: 17px; border-radius: 11px;
  border: 1.5px solid var(--line); background: var(--bg2); color: var(--fg);
  text-align: center; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.const-in.wide { width: 180px; text-align: left; }
.const-in:focus { outline: none; border-color: var(--acc); }

/* free-text answers (e.g. "state whether it is an identity, and why") */
.text-in {
  width: 100%; padding: 13px 15px; font-size: 17px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg2); color: var(--fg);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.text-in:focus { outline: none; border-color: var(--acc); }

/* inline maths inside a paragraph */
.math-inline { white-space: nowrap; }

/* the Identity chapter labels solved cells "solved"; Fraction Lab uses "done" */
.qcell.solved { background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: var(--ok); }
.qcell.solved .qn { color: var(--ok); }

/* reset-progress button */
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }

/* hero strip on the chapter home page */
.home-top { display: flex; justify-content: center; padding: 10px 0 4px; }

/* XP chip — same look as Fraction Lab's .chip */
.xp-chip {
  background: var(--card2); border: 1px solid var(--line); padding: 5px 12px;
  border-radius: 99px; font-weight: 700; font-size: 13px; color: var(--acc2);
  white-space: nowrap;
}

/* summary-note body copy */
.learn-body { font-size: 15.5px; line-height: 1.75; color: var(--fg); }
.learn-body p { margin: 0 0 12px; }
.learn-body strong { color: var(--fg); }
.learn-body em { color: var(--fg2); }

/* ==========================================================================
   Shell — chapter switcher shared by both chapters
   ========================================================================== */
.chap-switch { display: flex; gap: 6px; background: var(--card2); border: 1px solid var(--line); padding: 4px; border-radius: 99px; }
.chap-pill {
  padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 700;
  color: var(--fg2); white-space: nowrap; transition: background .15s, color .15s;
}
.chap-pill:hover { color: var(--fg); }
.chap-pill.on { background: var(--acc); color: #fff; }
.chapter-host { display: contents; }

@media (max-width: 780px) {
  .chap-switch { display: none; }
}
</style>

<script>/* ==========================================================================
   shell.js — Math Lab: the shared frame around both chapters

   Identities & Factorization and Algebraic Fractions & Formulas were built
   as two separate apps with heavily overlapping global names (F, Poly, BANK,
   SETS, LEARN, rnd, engine helpers...). Rather than rewrite two verified
   question banks, each chapter is loaded into its own scope and this shell
   provides everything they used to provide for themselves:

     * one progress record for the whole site
     * the header (chapter switcher, XP, theme) and footer
     * routing:  #/<chapter>/<path>   e.g. #/frac/q/q29
     * rewriting in-chapter links (#/home -> #/frac/home)
   ========================================================================== */

/* ----------------------------------------------------------- state ----- */
var STORE_KEY = 'mathlab_v1';

/* Union of the two chapters' state shapes: Identity Lab tracks `attempted`,
   Fraction Lab tracks `tried`. Extra keys are harmless. */
var DEFAULTS = {
  xp: 0, streak: 0, bestStreak: 0,
  solved: {}, tried: {}, attempted: {}, skills: {}
};

var __ML = {
  DEFAULTS: DEFAULTS,
  topics: {},          // filled in by each chapter bundle
  current: null,       // which chapter is mounted right now
  state: null,         // { theme, identity: {...}, frac: {...} }
  save: save
};

/* `prefix` is read by each chapter's nav() at call time, so it always
   points at whichever chapter is on screen. */
Object.defineProperty(__ML, 'prefix', {
  get: function () { return '#/' + (__ML.current || 'identity'); }
});

var CHAPTERS = {
  identity: {
    id: 'identity',
    nav: 'Identities & Factorization',
    short: 'Identities',
    blurb: 'Expand, factorise and prove identities — Pearson 2A, Add. Rev. Ex. 2',
    source: 'Book 2A · Chapter 2',
    icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<rect x="2" y="2" width="9" height="9" rx="2" fill="var(--acc)"/>' +
      '<rect x="13" y="2" width="9" height="9" rx="2" fill="var(--acc2)" opacity=".85"/>' +
      '<rect x="2" y="13" width="9" height="9" rx="2" fill="var(--acc2)" opacity=".85"/>' +
      '<rect x="13" y="13" width="9" height="9" rx="2" fill="var(--acc)"/></svg>'
  },
  frac: {
    id: 'frac',
    nav: 'Algebraic Fractions & Formulas',
    short: 'Fractions',
    blurb: 'Simplify, add, substitute and change the subject — Pearson 2A, Add. Rev. Ex. 3',
    source: 'Book 2A · Chapter 3',
    icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M4 3h16v4H4z" rx="1" fill="var(--acc2)"/>' +
      '<path d="M9 10h11v11H9z" rx="1" fill="var(--acc)" opacity=".85"/>' +
      '<path d="M3 11h4v10H3z" rx="1" fill="var(--acc2)" opacity=".55"/></svg>'
  }
};
var ORDER = ['identity', 'frac'];

function freshChapter() { return JSON.parse(JSON.stringify(DEFAULTS)); }

function load() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};
  var st = {
    theme: (s.theme === 'light' || s.theme === 'dark') ? s.theme : 'dark',
    identity: Object.assign(freshChapter(), s.identity || {}),
    frac: Object.assign(freshChapter(), s.frac || {})
  };
  return st;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(__ML.state)); } catch (e) { /* private mode */ }
}
__ML.state = load();
document.documentElement.dataset.theme = __ML.state.theme;
window.__ML = __ML;

/* ------------------------------------------------------ tiny helpers --- */
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined && html !== null) e.innerHTML = html;
  return e;
}
function inert(s) { return String(s).replace(/&(?!amp;|lt;|gt;|#\d+;)/g, '&amp;').replace(/</g, '&lt;'); }
function pct(done, total) { return total ? Math.round(done / total * 100) : 0; }

/* Per-chapter progress. Identity Lab stores solved values as the strings
   'solved' / 'helped'; Fraction Lab stores truthy values. Both count. */
function chapterStats(id) {
  var st = __ML.state[id], ch = __ML.topics[id];
  if (!ch) return { done: 0, total: 0, pct: 0, xp: 0, notes: 0 };
  var BANK = ch.BANK;
  var ids = Array.isArray(BANK) ? BANK.map(function (q) { return q.id; }) : Object.keys(BANK);
  var done = 0;
  ids.forEach(function (i) { if (st.solved[i]) done++; });
  return {
    done: done,
    total: ids.length,
    pct: pct(done, ids.length),
    xp: st.xp || 0,
    notes: (ch.LEARN || []).length
  };
}
function totals() {
  var t = { done: 0, total: 0, xp: 0, notes: 0 };
  ORDER.forEach(function (id) {
    var s = chapterStats(id);
    t.done += s.done; t.total += s.total; t.xp += s.xp; t.notes += s.notes;
  });
  t.pct = pct(t.done, t.total);
  return t;
}

/* ---------------------------------------------------------- header ---- */
function navActive(path) {
  if (!path) return '#/home';
  var head = String(path).split('/')[0];
  if (head === 'learn') return '#/learn';
  if (head === 'practice' || head === 'q' || head === 'smart') return '#/practice';
  if (head === 'progress') return '#/progress';
  return '#/home';
}
function renderHeader(current, path) {
  var h = el('header', 'topbar');
  var logo = el('a', 'logo');
  logo.href = '#/';
  logo.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<rect x="2" y="2" width="9" height="9" rx="2" fill="var(--acc)"/>' +
    '<rect x="13" y="2" width="9" height="9" rx="2" fill="var(--acc2)" opacity=".85"/>' +
    '<rect x="2" y="13" width="9" height="9" rx="2" fill="var(--acc2)" opacity=".85"/>' +
    '<rect x="13" y="13" width="9" height="9" rx="2" fill="var(--acc)"/></svg><span>Math&nbsp;Lab</span>';

  /* chapter switcher — always visible, so jumping chapters is one click */
  var sw = el('div', 'chap-switch');
  ORDER.forEach(function (id) {
    var c = CHAPTERS[id];
    var b = el('a', 'chap-pill' + (id === current ? ' on' : ''));
    b.href = '#/' + id + '/home';
    b.textContent = c.nav;
    sw.appendChild(b);
  });

  var navEl = el('nav', 'topnav');
  if (current) {
    var act = navActive(path);
    [['#/home', 'Home'], ['#/learn', 'Learn'], ['#/practice', 'Practice'], ['#/progress', 'Progress']]
      .forEach(function (pair) {
        var a = el('a', 'navlink' + (pair[0] === act ? ' active' : ''));
        a.href = '#/' + current + pair[0].slice(1);
        a.textContent = pair[1];
        navEl.appendChild(a);
      });
  }

  var right = el('div', 'topright');
  var t = totals();
  right.appendChild(el('span', 'chip', 'XP ' + t.xp));
  if (current) {
    var st = chapterStats(current);
    right.appendChild(el('span', 'chip', st.done + '/' + st.total));
  }
  var th = el('button', 'theme-btn');
  th.textContent = __ML.state.theme === 'dark' ? '☀️' : '🌙';
  th.title = 'Switch light / dark';
  th.onclick = function () {
    __ML.state.theme = __ML.state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = __ML.state.theme;
    save();
    route();
  };
  right.appendChild(th);

  h.append(logo, sw, navEl, right);
  return h;
}
function renderFooter() {
  var f = el('footer', 'foot');
  f.innerHTML = 'Math Lab · Identities &amp; Factorization and Algebraic Fractions &amp; Formulas ' +
    '(Pearson 2A, Additional Revision Exercises 2 &amp; 3) · works offline · ' +
    'progress is stored on this device only';
  return f;
}

/* ------------------------------------------------------- routing ------ */
var appEl = null;

function mountChapter(id, path) {
  var ch = CHAPTERS[id], topic = __ML.topics[id];
  if (!topic) { viewLanding(); return; }
  __ML.current = id;
  appEl.innerHTML = '';
  appEl.appendChild(renderHeader(id, path));
  var host = el('div', 'chapter-host');
  host.setAttribute('data-topic', id);
  appEl.appendChild(host);
  appEl.appendChild(renderFooter());
  topic.mount(host);
  topic.route(path);
}

function route() {
  var h = String(location.hash || '#/').replace(/^#\/?/, '');
  var parts = h.split('/');
  var head = parts[0];
  window.scrollTo(0, 0);
  __ML.current = null;
  if (head === '' || head === 'home') return viewLanding();
  if (head === 'progress') return viewProgress();
  if (CHAPTERS[head]) {
    __ML.current = head;
    var rest = parts.slice(1).join('/');
    return mountChapter(head, rest || 'home');
  }
  viewLanding();
}

/* In-chapter markup uses relative hashes (#/home). Rewrite them on the way
   out so the browser lands on #/frac/home. */
document.addEventListener('click', function (e) {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  var tgt = e.target;
  if (!tgt || !tgt.closest) return;
  var a = tgt.closest('a[href^="#/"]');
  if (!a) return;
  var host = a.closest('[data-topic]');
  if (!host) return;                       // header/shell links are already absolute
  var t = host.getAttribute('data-topic');
  var href = a.getAttribute('href');
  if (href === '#/' + t || href.indexOf('#/' + t + '/') === 0) return;
  e.preventDefault();
  location.hash = '#/' + t + href.slice(1);
}, true);

/* ------------------------------------------------- landing page ------- */
function ringSvg(p, big, small) {
  var r = 52, c = 2 * Math.PI * r, off = c * (1 - p / 100);
  return '<svg width="132" height="132" viewBox="0 0 132 132" style="display:block;margin:0 auto">' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="11"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="url(#gr)" stroke-width="11" ' +
    'stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" ' +
    'transform="rotate(-90 66 66)"/><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="var(--acc)"/><stop offset="100%" stop-color="var(--acc2)"/>' +
    '</linearGradient></defs><text x="66" y="63" text-anchor="middle" fill="var(--fg)" ' +
    'font-size="21" font-weight="800" font-family="inherit">' + big + '</text>' +
    '<text x="66" y="82" text-anchor="middle" fill="var(--fg2)" font-size="11.5" ' +
    'font-family="inherit">' + small + '</text></svg>';
}

function viewLanding() {
  appEl.innerHTML = '';
  appEl.appendChild(renderHeader(null, null));

  var main = el('main', 'content');
  var t = totals();

  var hero = el('section', 'hero');
  hero.appendChild(el('h1', null, 'Math Lab'));
  hero.appendChild(el('p', null,
    'Two chapters of Book 2A, in one place. Read a summary, try the workbook questions, ' +
    'ask for a hint when you get stuck — and if you get one wrong, the app writes you a ' +
    'fresh question of the same type to try again.'));
  var row = el('div', 'home-top');
  var b1 = el('a', 'btn primary'); b1.href = '#/identity/home'; b1.textContent = '▶ Smart practice';
  var b2 = el('a', 'btn'); b2.href = '#/progress'; b2.textContent = 'My progress';
  row.append(b1, b2);
  hero.appendChild(row);
  main.appendChild(hero);

  var ring = el('div', 'home-ring');
  ring.innerHTML = ringSvg(t.pct, t.done + '/' + t.total, 'questions mastered');
  ring.appendChild(el('p', null, '<i>' + t.done + ' of ' + t.total + ' questions done · ' +
    t.xp + ' XP · ' + t.notes + ' summary notes</i>'));
  main.appendChild(ring);

  var grid = el('div', 'learn-grid');
  ORDER.forEach(function (id) {
    var c = CHAPTERS[id], s = chapterStats(id);
    var card = el('a', 'card learn-card');
    card.href = '#/' + id + '/home';
    card.innerHTML =
      '<div class="learn-ic">' + c.icon + '</div>' +
      '<h3>' + c.nav + '</h3>' +
      '<p>' + c.blurb + '</p>' +
      '<div class="set-meta"><span>' + c.source + '</span> <span>' +
      s.done + ' / ' + s.total + ' mastered</span></div>' +
      '<progress value="' + s.pct + '" max="100" style="margin-top:10px"></progress>' +
      '<small>' + s.notes + ' summary notes · ' + s.xp + ' XP</small>';
    grid.appendChild(card);
  });
  main.appendChild(grid);

  var how = el('section', 'card how');
  how.appendChild(el('h2', null, '🛈 How this works'));
  var ol = document.createElement('ol');
  [
    '<b>Pick a chapter</b> — Identities &amp; Factorization, or Algebraic Fractions &amp; Formulas.',
    '<b>Read a summary</b> — each one covers a single skill with worked examples.',
    '<b>Try the practice set</b> — the real workbook questions, in order.',
    '<b>Stuck?</b> Ask for a hint. They arrive one step at a time, so you still do the thinking.',
    '<b>Got it wrong?</b> The app writes you a <b>brand-new similar question</b> of the same type.',
    '<b>Really stuck?</b> Reveal the full step-by-step solution.'
  ].forEach(function (x) { var li = document.createElement('li'); li.innerHTML = x; ol.appendChild(li); });
  how.appendChild(ol);
  main.appendChild(how);

  appEl.appendChild(main);
  appEl.appendChild(renderFooter());
}

/* ------------------------------------------------- combined progress --- */
function viewProgress() {
  appEl.innerHTML = '';
  appEl.appendChild(renderHeader(null, 'progress'));
  var main = el('main', 'content');
  var t = totals();

  main.appendChild(el('h1', 'page-title', '📊 My progress'));
  main.appendChild(el('p', 'page-sub',
    'Everything is stored on this device only — nothing is sent anywhere.'));

  var top = el('section', 'card');
  top.innerHTML = ringSvg(t.pct, t.done + '/' + t.total, 'overall');
  top.appendChild(el('p', 'set-meta', '<b>' + t.xp + ' XP</b> earned · ' +
    t.done + ' of ' + t.total + ' questions mastered across both chapters'));
  main.appendChild(top);

  ORDER.forEach(function (id) {
    var c = CHAPTERS[id], s = chapterStats(id), st = __ML.state[id];
    var card = el('section', 'card');
    card.innerHTML =
      '<h2><a href="#/' + id + '/home">' + c.nav + '</a></h2>' +
      '<div class="set-meta"><span>' + c.source + '</span> <span>' +
      s.done + ' / ' + s.total + ' mastered · ' + s.xp + ' XP · best streak ' +
      (st.bestStreak || 0) + '</span></div>' +
      '<progress value="' + s.pct + '" max="100" style="margin-top:10px"></progress>';

    /* weakest skills, straight from the chapter's own skill tallies */
    var sk = st.skills || {};
    var rows = Object.keys(sk).map(function (k) {
      var v = sk[k] || { a: 0, c: 0 };
      return { k: k, a: v.a || 0, c: v.c || 0, p: v.a ? Math.round(v.c / v.a * 100) : 0 };
    }).filter(function (r) { return r.a > 0; }).sort(function (x, y) { return x.p - y.p; }).slice(0, 4);

    if (rows.length) {
      var box = el('div', 'list-row');
      var ul = document.createElement('div');
      ul.style.flex = '1';

/* find the common monomial factor of a 2-term group, return its tex */
function commonOf(g) {
  const ts = g.sortedTerms();
  let cm = { ...ts[0].m }, cc = ts[0].c;
  for (const t of ts) {
    for (const v in cm) if (!(t.m[v])) delete cm[v];
    for (const v in cm) cm[v] = Math.min(cm[v], t.m[v] || 0);
    // numeric gcd
  }
  const nums = ts.map(t => Math.abs(t.c.n));
  const g0 = nums.reduce((x, y) => gcd(x, y), nums[0]);
  const dens = ts.map(t => t.c.d);
  const dl = dens.reduce((x, y) => x * y / gcd(x, y), 1);
  const sgnAll = ts.every(t => t.c.n > 0) ? 1 : (ts.every(t => t.c.n < 0) ? -1 : 1);
  let monoTex = '';
  for (const v of Object.keys(cm).sort()) monoTex += (cm[v] ? v + (cm[v] > 1 ? '^{' + cm[v] + '}' : '') : '');
  const num = Math.abs(g0) / dl;
  let coeffTex = (num === 1 ? '' : String(num));
  if (sgnAll < 0) coeffTex = '-' + coeffTex;
  if (!monoTex && num === 1) return sgnAll < 0 ? '-' : '';
  return coeffTex + monoTex;
}

function genMcqFactor() {
  const style = pick(['diffsq', 'grouping', 'perfsq', 'binsq']);
  const X = pick(VARS1), Y = pick(VARS1.filter(v => v !== X));
  if (style === 'diffsq') {
    const a = nz(2, 6), b = nz(2, 6);
    const correct = '(' + a + X + ' + ' + b + Y + ')(' + a + X + ' - ' + b + Y + ')';
    const wrongs = ['(' + a + X + ' - ' + b + Y + ')(' + a + X + ' - ' + b + Y + ')', '(' + a + X + ' + ' + b + Y + ')(' + a + X + ' + ' + b + Y + ')', '(' + a + 'X - ' + b + Y + ')('.replace('X', X) + (a + 1) + X + ' + ' + b + Y + ')'];
    const q = Poly.monomial({ [X]: 2 }, a * a).sub(Poly.monomial({ [Y]: 2 }, b * b));
    return mcqFromTex('Factorise $' + q.toLatex() + '$.', correct, wrongs, ['Both terms are perfect squares: $A^2 - B^2$.', '$A = ' + a + X + '$, $B = ' + b + Y + '$.', '$A^2 - B^2 = (A+B)(A-B)$ — check the signs in each option.']);
  }
  if (style === 'perfsq') {
    const a = nz(2, 5), b = nz(2, 5);
    const correct = '(' + a + X + ' + ' + b + Y + ')^2';
    const wrongs = ['(' + a + X + ' - ' + b + Y + ')^2', '(' + (a * a) + X + ' + ' + (b * b) + Y + ')^2', '(' + a + X + ' + ' + b + 'Y)('.replace('Y)', Y + ')') + a + X + ' - ' + b + Y + ')'];
    const q = Poly.c(a).mul(Poly.v(X)).add(Poly.c(b).mul(Poly.v(Y))).pow(2);
    return mcqFromTex('Factorise $' + q.toLatex() + '$.', correct, wrongs, ['Check the middle term: it is $+2AB$, so both brackets have the **same** sign.', 'Here $A = ' + a + X + '$ and $B = ' + b + Y + '$.', 'It is $(A + B)^2$.']);
  }
  if (style === 'grouping') {
    const g = genFactorGrouping();
    const A = g.ansTex.split(')(');
    const correct = g.ansTex;
    const f1 = A[0] + ')', f2 = '(' + A[1];
    const wrongs = [f1.replace(/(\+|-)/, m => m === '+' ? '-' : '+') + f2, f1 + f2.replace(/(?<=\()(\+|-)/, m => m === '+' ? '-' : '+'), f1.replace(/(\+|-)/g, m => m === '+' ? '-' : '+') + f2.replace(/(?<=\()(\+|-)/, m => m === '+' ? '-' : '+')];
    return mcqFromTex(g.q.replace(/\n\$\$/, ' $').replace('$$', '$'), correct, wrongs, g.hints);
  }
  // binsq: (A)² − c² with linear A
  const a = nz(2, 4), b = nz(1, 4), c = nz(2, 6);
  const lin = a + X + (b < 0 ? ' - ' + (-b) : ' + ' + b);
  const correct = '(' + lin + ' + ' + c + ')(' + lin + ' - ' + c + ')';
  const wrongs = ['(' + lin + ' + ' + c + ')(' + lin + ' + ' + c + ')', '(' + lin + ' - ' + c + ')(' + lin + ' - ' + c + ')', '(' + lin + ' + ' + c + ')(-' + lin + ' + ' + c + ')'];
  const q = Poly.c(a).mul(Poly.v(X)).add(Poly.c(b)).pow(2).sub(Poly.c(c * c));
  return mcqFromTex('Factorise $' + q.toLatex() + '$.', correct, wrongs, ['This is $A^2 - B^2$ with $A = ' + lin + '$ and $B = ' + c + '$.', 'Use $(A+B)(A-B)$ — the two brackets differ only in the middle sign.', 'Check: expanding option D gives $B^2 - A^2$, not $A^2 - B^2$.']);
}
function mcqFromTex(qText, correct, wrongs, hints) {
  return {
    kind: 'mcq', q: qText,
    options: shuffle([{ tex: correct, correct: true }, ...wrongs.map(w => ({ tex: w, correct: false }))]),

}
function genMcqHasFactor() {
  const r = nz(2, 5);
  const design = pick(['IIonly', 'IIandIII']);
  const I = nz(2, 5) + 'x + ' + (nz(2, 5) * r);

function genMcqFactorOf() {
  const m = pick(['m', 'p', 'k']), n = pick(['n', 'q', 't']);
  const k = nz(1, 5);
  const correct = m + ' + ' + n;
  const wrongs = [m + ' - ' + n, k + ' + ' + m + ' + ' + n, k + ' - ' + m + ' + ' + n];

  return {

    steps: [

    src: 'genMcqFactorOf'
  };

/* ---------- math + markdown rendering ---------- */
function hasKatex() { return typeof katex !== 'undefined'; }
function renderMathInto(el, text) {
  el.innerHTML = '';
  const segs = String(text).split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  for (const seg of segs) {
    if (!seg) continue;
    if (seg.startsWith('$$')) {
      const d = document.createElement('div');
      d.className = 'math-display';
      const src = seg.slice(2, -2);
      if (hasKatex()) { try { katex.render(src, d, { displayMode: true, throwOnError: false }); } catch (e) { d.textContent = src; } }
      else d.textContent = src;
      el.appendChild(d);
    } else if (seg.startsWith('$')) {
      const sp = document.createElement('span');
      sp.className = 'math-inline';
      const src = seg.slice(1, -1);
      if (hasKatex()) { try { katex.render(src, sp, { throwOnError: false }); } catch (e) { sp.textContent = src; } }
      else sp.textContent = src;
      el.appendChild(sp);
    } else {
      renderRichText(el, seg);
    }
  }
}
function renderRichText(el, text) {
  const lines = String(text).split('\n');
  lines.forEach((line, i) => {
    if (i > 0) el.appendChild(document.createElement('br'));
    const parts = line.split('**');
    parts.forEach((p, j) => {
      if (j % 2 === 1) { const s = document.createElement('strong'); s.textContent = p; el.appendChild(s); }
      else el.appendChild(document.createTextNode(p));
    });
  });
}
function texPlainToTex(s) { // for live answer preview
  return String(s).replace(/[\u2212]/g, '-').replace(/\*/g, '\\cdot ').replace(/\^(\d+)/g, '^{$1}');
}

/* ---------- router ---------- */
/* The shell owns location.hash and hands each chapter the part of the path
   that belongs to it; `app` is the container the shell gives us to draw in.
   In-chapter hashes stay relative (#/home) and the shell rewrites them to
   #/identity/home, so none of the code below had to change. */
var app = null;

function route() {
  const h = String(__path || 'home').replace(/^\/+/, '');
  const [head, arg] = h.split('/');

/* ---------------- gens.js ---------------- */
/* ============================================================================
   gens.js — similar-question generators.

   Every question is built OUT OF its answer, so the answer can never be wrong:
     * product families multiply known factors together (no division needed)
     * add/subtract families build the L.C.M. from a known factor multiset
     * "make the subject" families are solved with exact rational arithmetic
   ========================================================================== */

const D2 = '\\dfrac';

/* ---------- factor-multiset bookkeeping ------------------------------------ */
function keyMon(p) { return p.polyKey(); }
function msAdd(ms, p, e) {
  const k = keyMon(p);
  ms.set(k, (ms.get(k) || { p, e: 0 }));
  ms.get(k).e += e;
  return ms;
}
function msProduct(ms, extra) {
  let out = typeof extra === 'number' ? Poly.const(extra) : (extra || Poly.const(1));
  for (const v of ms.values()) if (v.e > 0) out = out.mul(v.p.pow(v.e));
  return out;
}
function msSubset(ms, take) {           // multiset of the SAME pieces, fewer copies
  const out = new Map();
  const all = [...ms.values()];
  for (const v of all) {
    let n = Math.min(v.e, take--);
    if (n > 0) msAdd(out, v.p, n);
    if (take <= 0) break;
  }
  return out;
}
function msComplement(ms, sub) {
  const out = new Map();
  for (const [k, v] of ms) {
    const use = sub.has(k) ? sub.get(k).e : 0;
    if (v.e - use > 0) msAdd(out, v.p, v.e - use);
  }
  return out;
}

/* ---------- random small helpers ------------------------------------------ */
function smallP(vs, allowLinear) {
  if (allowLinear && rnd(2)) return linForm([pick(vs), pick(vs)]);
  let p = Poly.mon({ [pick(vs)]: 1 }, F(1));
  return p;
}
function linForm(vs) {
  let a, b, tries = 0;
  do { a = nz(-4, 4); b = nz(-4, 4); tries++; } while (tries < 12 && (a === 0 && b === 0));
  let p = Poly.var(vs[0], 1).scale(F(a));
  if (vs[1] && vs[1] !== vs[0]) p = p.add(Poly.var(vs[1], 1).scale(F(b)));
  return p.factorCommon().rest;
}
function fracTex(f) { return f.d === 1 ? String(f.n) : D2 + '{' + f.n + '}{' + f.d + '}'; }

/* Does this LaTeX snippet need brackets once it becomes a factor? */
function wrapNeeded(s) {
  s = String(s);
  if (/^[+-]/.test(s)) return true;
  let depth = 0, signs = 0;
  for (const ch of s) {
    if (ch === '{') depth++;
    else if (ch === '}') depth--;
    else if (depth === 0 && (ch === '+' || ch === '-')) signs++;
  }
  return signs > 0;
}
/* Render "a × b", adding brackets so multi-term factors stay intact. */
function mulTex(a, b) {
  const A = wrapNeeded(a) ? '(' + a + ')' : a;
  const B = wrapNeeded(b) ? '(' + b + ')' : b;
  return A + '\\times ' + B;
}

/* ========================================================================== */
/* 1. cancel common factors out of ONE fraction                               */
/* ========================================================================== */
function G_cancel(o) {
  o = o || {};
  const hard = !!o.hard;
  for (let attempt = 0; attempt < 60; attempt++) {
    const vs = pickVars(ri(1, hard ? 3 : 2));
    const kindP = hard ? rnd(3) : (rnd(2) ? 0 : 1);
    let P;
    if (kindP === 0) P = Poly.mon({ [pick(vs)]: ri(1, 2) }, F(nz(2, 6)));
    else if (kindP === 1) P = Poly.const(nz(2, 6));
    else P = linForm([vs[0], vs[1] || vs[0]]);
    const mk = () => {
      if (rnd(3) === 0) return Poly.mon({ [pick(vs)]: ri(1, 2) }, F(rnd(2) ? 1 : 2));
      return linForm([pick(vs), pick(vs)]);
    };
    let A = mk(), B = mk();
    if (hard && rnd(3) === 0) B = P.scale(F(ri(1, 2)));
    if (A.isZero() || B.isZero() || P.isZero()) continue;
    if (A.polyKey() === B.polyKey()) continue;
    const neg = rnd(4) === 0;
    const num = P.mul(A);
    const den = P.mul(B).scale(neg ? F(-1) : F(1));
    if (num.vars().size === 0 || den.vars().size === 0) continue;
    if (num.terms.size + den.terms.size < 3 && !hard) continue;
    const Beff = B.scale(neg ? F(-1) : F(1));
    const ans = ratClean(rat(A, Beff));
    if (ans.n.isZero()) continue;
    const body = D2 + '{' + num.toLatex() + '}{' + den.toLatex() + '}';
    const steps = [
      'Factorise the numerator and the denominator separately.',
      '$' + num.toLatex() + ' = ' + mulTex(P.toLatex(), A.toLatex()) + '$',
      '$' + den.toLatex() + ' = ' + (neg ? '-' : '') + mulTex(P.toLatex(), B.toLatex()) + '$',
      'Cancel the common factor $' + P.toLatex() + '$.',
      '$' + body + ' = ' + ratToLatex(ans) + '$'
    ];
    return {
      kind: 'expr', family: 'cancel',
      prompt: 'Simplify the following expression.',
      body: body, ans: ans, ansTex: ratToLatex(ans),
      hints: [
        'Neither line is a product yet — factorise first.',
        'The same block $' + P.toLatex() + '$ is hiding inside both lines.'
      ],
      steps: steps
    };
  }
  return G_cancel(o);
}

/* ========================================================================== */
/* 2. multiply / divide algebraic fractions                                   */
/* ========================================================================== */
function G_mulDiv(o) {
  o = o || {};
  const hard = !!o.hard;
  for (let attempt = 0; attempt < 80; attempt++) {
    const vs = pickVars(ri(2, hard ? 3 : 2));
    const pool = [];
    for (const v of vs) pool.push(Poly.var(v, 1));
    for (let i = 0; i < (hard ? 3 : 1); i++) pool.push(linForm([pick(vs), pick(vs)]));
    const nFrac = hard ? ri(2, 3) : 2;
    const groups = [];
    for (let i = 0; i < nFrac; i++) groups.push({ top: [], bot: [] });
    // deliberate cancellations
    const cancelN = hard ? ri(2, 3) : ri(1, 2);
    for (let i = 0; i < cancelN; i++) {
      const f = pick(pool);
      const flipame = rnd(3) === 0;
      const gi = rnd(nFrac), gj = rnd(nFrac);
      groups[gi].top.push(f);
      groups[gj].bot.push(flipame ? f.scale(F(-1)) : f);
    }
    // whatever is left becomes the answer
    const resN = hard ? ri(1, 2) : 1;
    for (let i = 0; i < resN; i++) groups[rnd(nFrac)].top.push(pick(pool));
    if (hard && rnd(2)) groups[rnd(nFrac)].bot.push(pick(pool));
    if (groups.every(g => g.top.length === 0)) continue;
    if (groups.every(g => g.bot.length === 0)) continue;
    const ops = [];
    for (let i = 1; i < nFrac; i++) ops.push(rnd(2) ? '\\times' : '\\div');
    const eff = groups.map((g, i) => {
      const flipped = i > 0 && ops[i - 1] === '\\div';
      return flipped ? { top: g.bot, bot: g.top } : { top: g.top, bot: g.bot };
    });
    let numP = Poly.const(1), denP = Poly.const(1);
    for (const g of eff) {
      for (const f of g.top) numP = numP.mul(f);
      for (const f of g.bot) denP = denP.mul(f);
    }
    const normVals = pool.map(f => f.norm().poly);
    const red = reduceKnown(numP, denP, normVals);
    const ans = ratClean(red);
    if (ans.n.isZero()) continue;
    const shown = groups.map(g => {
      const top = g.top.reduce((a, b) => a.mul(b), Poly.const(1));
      const bot = g.bot.reduce((a, b) => a.mul(b), Poly.const(1));
      return { top, bot };
    });
    if (shown.some(s => s.top.isZero())) continue;
    const body = shown.map(s => D2 + '{' + s.top.toLatex() + '}{' + s.bot.toLatex() + '}')
      .reduce((acc, s, i) => i === 0 ? s : acc + ' ' + ops[i - 1] + ' ' + s, '');
    const hasDiv = ops.includes('\\div');
    const steps = [
      hasDiv ? 'To divide by a fraction, multiply by its reciprocal — turn it upside down and change $\\div$ to $\\times$.'
        : 'Multiply the numerators together and the denominators together.',
      'Cancel every factor that appears both above and below the line.',
      '$' + body + ' = ' + ratToLatex(ans) + '$'
    ];
    return {
      kind: 'expr', family: 'mulDiv',
      prompt: 'Simplify the following expression.',
      body: body, ans: ans, ansTex: ratToLatex(ans),
      hints: [
        hasDiv ? 'Rewrite the division as multiplication by the flipped fraction first.' : 'You can cancel across the multiplication before you multiply out.',
        'Never cancel part of a sum — only whole factors may be cancelled.'
      ],
      steps: steps
    };
  }
  return G_mulDiv(o);
}

/* ========================================================================== */
/* 3. add / subtract algebraic fractions                                      */
/* ========================================================================== */
function G_addSub(o) {
  o = o || {};
  const hard = !!o.hard;
  for (let attempt = 0; attempt < 80; attempt++) {
    const vs = pickVars(ri(1, hard ? 3 : 2));
    const nTerm = hard ? (rnd(3) === 0 ? 3 : 2) : 2;
    /* build the L.C.M.'s factor multiset */
    const lcm = new Map();
    msAdd(lcm, Poly.const(pick([2, 3, 4, 5, 6])), 1);
    if (rnd(2)) msAdd(lcm, Poly.const(pick([2, 3])), 1);
    const nPieces = hard ? ri(1, 2) : 1;
    for (let i = 0; i < nPieces; i++) {
      const p = (hard && rnd(2)) ? linForm([vs[0], vs[1] || vs[0]]) : Poly.var(vs[i % vs.length], 1);
      msAdd(lcm, p, hard && rnd(4) === 0 ? 2 : 1);
    }
    const lcmEntries = [...lcm.values()];
    let L = Poly.const(1);
    for (const v of lcmEntries) L = L.mul(v.p.pow(v.e));
    /* each denominator takes a sub-multiset of the L.C.M. pieces */
    const terms = [];
    for (let i = 0; i < nTerm; i++) {
      const sub = new Map();
      for (const v of lcmEntries) {
        let e = ri(0, v.e);
        if (e > 0) msAdd(sub, v.p, e);
      }
      if (sub.size === 0) msAdd(sub, lcmEntries[0].p, 1);
      let den = msProduct(sub, 1);
      const flipS = rnd(4) === 0;
      if (flipS) den = den.scale(F(-1));
      terms.push({ den, denMS: sub, flipS });
    }
    /* pick numerators */
    for (const t of terms) {
      const nk = rnd(3);
      if (nk === 0) t.num = Poly.const(nz(2, 9));
      else if (nk === 1) t.num = Poly.mon({ [pick(vs)]: 1 }, F(nz(1, 6)));
      else t.num = linForm([vs[vs.length - 1], vs[0]]);
      t.sign = 1;
    }
    for (let i = 1; i < terms.length; i++) terms[i].sign = rnd(2) ? 1 : -1;
    /* if there are denominators with the same multiset, force a shared piece */
    const knows = lcmEntries.map(v => v.p.norm().poly);
    /* combine */
    let acc = Poly.const(0);
    const detail = [];
    for (const t of terms) {
      const comp = msComplement(lcm, t.denMS);
      let mult = msProduct(comp, 1);
      if (t.flipS) mult = mult.scale(F(-1));
      const contrib = t.num.mul(mult).scale(F(t.sign));
      detail.push(D2 + '{' + t.num.toLatex() + '}{' + t.den.toLatex() + '} = ' +
        D2 + '{' + contrib.toLatex() + '}{' + L.toLatex() + '}');
      acc = acc.add(contrib);
    }
    if (acc.isZero() || L.isZero()) continue;
    let red = ratClean(rat(acc, L));
    const red2 = reduceKnown(red.n, red.d, knows);
    const ans = ratClean(red2);
    if (ans.n.isZero()) continue;
    const body = terms.map((t, i) =>
      (i === 0 ? '' : (t.sign > 0 ? ' + ' : ' - ')) + D2 + '{' + t.num.toLatex() + '}{' + t.den.toLatex() + '}'
    ).join('');
    const steps = [
      'Find the L.C.M. of the denominators: $' + L.toLatex() + '$.',
      ...detail,
      'Combine into a single fraction: $' + D2 + '{' + acc.toLatex() + '}{' + L.toLatex() + '}$.',
      'Simplify: $' + ratToLatex(ans) + '$'
    ];
    return {
      kind: 'expr', family: 'addSub',
      prompt: 'Simplify the following expression.',
      body: body, ans: ans, ansTex: ratToLatex(ans),
      hints: [
        'The denominators are not the same, so find their L.C.M. first.',
        'The L.C.M. of the denominators is $' + L.toLatex() + '$.'
      ],
      steps: steps
    };
  }
  return G_addSub(o);
}

/* ========================================================================== */
/* 4. substitution into a formula                                             */
/* ========================================================================== */
function G_subst(o) {
  o = o || {};
  const hard = !!o.hard;
  for (let attempt = 0; attempt < 40; attempt++) {
    const vs = pickVars(hard ? ri(2, 3) : 2);
    const target = pick(vs);
    const others = vs.filter(v => v !== target);
    const vals = {};
    for (const v of others) vals[v] = nz(-4, 6);
    const env = {};
    for (const v of others) env[v] = F(vals[v]);
    const shape = hard ? rnd(3) : rnd(2);
    let rhs;
    if (shape === 0) {
      rhs = ratNum(Poly.const(nz(1, 12)));
      for (const v of others) rhs = ratAdd(rhs, ratScale(ratVar(v), F(nz(-9, 12))));
    } else if (shape === 1) {
      rhs = ratNum(Poly.const(nz(1, 6)));
      for (const v of others) rhs = ratAdd(rhs, ratScale(ratVar(v), F(nz(-6, 9))));
      if (hard) rhs = ratAdd(rhs, ratScale(ratPow(ratVar(others[0]), 2), F(nz(1, 3))));
    } else {
      rhs = ratDiv(ratNum(Poly.const(nz(2, 30))), ratVar(others[0]));
      for (let i = 1; i < others.length; i++) rhs = ratAdd(rhs, ratScale(ratVar(others[i]), F(nz(-6, 9))));
    }
    const denomV = rhs.d.eval(env);
    const numV = rhs.n.eval(env);
    if (denomV === null || numV === null || fIsZero(denomV)) continue;
    const ans = fDiv(numV, denomV);
    if (!fIsInt(ans)) continue;
    if (Math.abs(ans.n) > 200) continue;
    const subs = Object.entries(vals).map(([v, x]) => v + ' = ' + x).join(',\\ ');
    const body = '$' + target + ' = ' + ratToLatex(rhs) + '$\\quad [' + target + ']\\ \\text{ if } ' + subs;
    const steps = ['Put the given numbers into the formula.'];
    for (const v of others) steps.push('$' + v + ' = ' + vals[v] + '$');
    steps.push('$' + target + ' = ' + ratToLatex(rhs)
      .replace(new RegExp('\\b(' + others.join('|') + ')\\b', 'g'), (m, g1) => '(' + vals[g1] + ')') + '$');
    steps.push('$' + target + ' = ' + fracTex(ans) + '$');
    return {
      kind: 'num', family: 'subst', ansNum: ans,
      prompt: 'In the following formula, find the value of the letter in the brackets by substitution.',
      body: body, ans: Poly.const(ans), ansTex: fracTex(ans),
      hints: ['Replace every other letter by its number first.', 'Then just do the arithmetic carefully.'],
      steps: steps
    };
  }
  return G_subst(o);
}

/* substitution where the unknown sits inside the equation (Level 2 style) */
function G_substSolve(o) {
  o = o || {};
  for (let attempt = 0; attempt < 40; attempt++) {
    const vs = pickVars(3);
    const [x, a, b] = vs;
    const A = F(nz(2, 6));
    const Bp = Poly.const(nz(-9, 9)).add(Poly.var(a, 1).scale(F(nz(-6, 9))));
    const Cp = Poly.const(nz(-9, 9)).add(Poly.var(b, 1).scale(F(nz(-6, 9))));
    const lhs = rat(Poly.var(x, 1).scale(A).add(Bp), Poly.const(1));
    const rhs = ratNum(Cp);
    const vals = { [a]: nz(-3, 5), [b]: nz(-3, 5) };
    const env = { [a]: F(vals[a]), [b]: F(vals[b]) };
    const Bv = Bp.eval(env), Cv = Cp.eval(env);
    if (Bv === null || Cv === null) continue;
    const ans = fDiv(fSub(Cv, Bv), A);
    if (!fIsInt(ans) || Math.abs(ans.n) > 40) continue;
    const body = '$' + ratToLatex(lhs) + ' = ' + ratToLatex(rhs) + '$\\quad [' + x + ']\\ \\text{ if } ' +
      a + ' = ' + vals[a] + ' \\text{ and } ' + b + ' = ' + vals[b];
    const steps = ['Substitute $' + a + ' = ' + vals[a] + '$ and $' + b + ' = ' + vals[b] + '$ into the formula.',
      'Then solve the resulting equation for $' + x + '$.',
      '$' + x + ' = ' + fracTex(ans) + '$'];
    return {
      kind: 'num', family: 'substSolve', ansNum: ans,
      prompt: 'In the following formula, find the value of the letter in the brackets by substitution.',
      body: body, ans: Poly.const(ans), ansTex: fracTex(ans),
      hints: ['Put the numbers in first — then it is just an equation.', 'Keep the letter in brackets on one side.'],
      steps: steps

  }
  return null;
}

/* ========================================================================== */
/* 5. change the subject                                                      */
/* ========================================================================== */
function solveFor(lhsRat, rhsRat, target) {
  const diff = ratSub(lhsRat, rhsRat);
  const s = diff.n.splitLinear(target);
  if (!s || s.A.isZero()) return null;
  const ans = ratClean(rat(s.B.scale(F(-1)), s.A));
  /* verify: put the answer back into the equation at random points */
  const vars = [...new Set([...ratVars(diff), ...ratVars(ans)])].filter(v => v !== target);
  let ok = 0, tries = 0;
  while (tries < 40 && ok < 6) {
    tries++;
    const env = {};
    for (const v of vars) env[v] = TEST_POINTS[rnd(TEST_POINTS.length)];
    const xv = ratEval(ans, env);
    if (xv === null) continue;
    env[target] = xv;
    const d = ratEval(diff, env);
    if (d === null) continue;
    if (!fIsZero(d)) return null;
    ok++;
  }
  if (ok < 6) return null;
  return ans;
}
const SUBJ = {
  /* ---- level 1 templates ---- */
  s1(o) {                                   //  P / (c·x) = k        [x]
    const [x, a, b] = o.vs, c = F(nz(2, 6)), k = F(nz(2, 9));
    const lhs = rat(Poly.var(a, 1).mul(Poly.var(b, 1)), Poly.const(1).mul(Poly.var(x, 1)).scale(c));
    return { lhs, rhs: ratNum(Poly.const(k.n)), x };
  },
  s2(o) {                                   //  a = k - c·b·x        [x]
    const [x, a, b] = o.vs;
    const rhs = Poly.const(nz(1, 15)).sub(Poly.var(b, 1).mul(Poly.var(x, 1)).scale(F(nz(2, 7))));
    return { lhs: ratVar(a), rhs: ratNum(rhs), x };
  },
  s3(o) {                                   //  x·a + x·b = k        [x]
    const [x, a, b] = o.vs, k = F(ri(1, 5), pick([1, 2, 3]));
    const lhs = rat(Poly.var(x, 1).mul(Poly.var(a, 1).add(Poly.var(b, 1))), Poly.const(1));
    return { lhs, rhs: ratNum(Poly.const(k)), x };
  },
  s4(o) {                                   //  c(α·x + β·y) = k + δ·x   [x]
    const [x, y] = o.vs, c = F(nz(2, 4)), A = F(nz(2, 4)), B = F(nz(1, 4)), k = F(nz(1, 9)), D = F(nz(1, 4));
    const lhs = ratNum(Poly.var(x, 1).scale(A).add(Poly.var(y, 1).scale(B)).scale(c));
    const rhs = ratNum(Poly.const(k.n).add(Poly.var(x, 1).scale(D)));
    return { lhs, rhs, x };
  },
  s5(o) {                                   //  E = (p·u)/x - q        [x]
    const [x, a, b] = o.vs;
    const lhs = ratVar(a);
    const n = Poly.var(b, 1).scale(F(nz(2, 6))).sub(Poly.const(nz(1, 6)).mul(Poly.var(x, 1)));
    return { lhs, rhs: rat(n, Poly.var(x, 1)), x };
  },
  s6(o) {                                   //  p/x + q/y = k         [x]
    const [x, a, b] = o.vs;
    const lhs = ratAdd(rat(Poly.const(nz(1, 6)), Poly.var(x, 1)), rat(Poly.const(nz(1, 5)), Poly.var(a, 1)));
    return { lhs, rhs: ratNum(Poly.const(nz(2, 9))), x };
  },
  /* ---- level 2 templates ---- */
  h1(o) {                                   //  y = x / (c - x)       [x]
    const [x, y] = o.vs, c = F(nz(2, 9));
    const rhs = rat(Poly.var(x, 1), Poly.const(c.n).sub(Poly.var(x, 1)));
    return { lhs: ratVar(y), rhs, x };
  },
  h2(o) {                                   //  (x + a)/(x + b) = n   [x]
    const [x, y, z] = o.vs;
    const a = nz(-9, 9);
    let b = nz(-9, 9);
    while (b === a) b = nz(-9, 9);
    const lhs = rat(Poly.var(x, 1).add(Poly.const(a)), Poly.var(x, 1).add(Poly.const(b)));
    return { lhs, rhs: ratVar(y), x };
  },
  h3(o) {                                   //  T = (k + x)/x - c·y   [x]
    const [x, y, z] = o.vs;
    const rhs = ratSub(rat(Poly.const(nz(1, 6)).add(Poly.var(x, 1)), Poly.var(x, 1)),
      ratNum(Poly.var(y, 1).scale(F(nz(1, 4)))));
    return { lhs: ratVar(z || 'T'), rhs, x };
  },
  h4(o) {                                   //  p·x - r(x - 1) = 2(x + 1) + p   [x]
    const [x, p, r] = o.vs;
    const lhs = ratNum(Poly.var(x, 1).mul(Poly.var(p, 1))
      .sub(Poly.var(x, 1).sub(Poly.const(1)).mul(Poly.var(r, 1))));
    const rhs = ratNum(Poly.const(2).mul(Poly.var(x, 1).add(Poly.const(1))).add(Poly.var(p, 1)));
    return { lhs, rhs, x };
  },
  h5(o) {                                   //  (g - x)/x - f/a = -k/a   [x]
    const [x, g, f, a] = o.vs;
    const lhs = ratSub(rat(Poly.var(g, 1).sub(Poly.var(x, 1)), Poly.var(x, 1)),
      rat(Poly.var(f, 1), Poly.var(a, 1)));
    const rhs = rat(Poly.const(-nz(1, 4)), Poly.var(a, 1));
    return { lhs, rhs, x };
  },
  h6(o) {                                   //  αu/(βx) = (γu - δx)/(εx) - ζ   [x]
    const [x, u] = o.vs;
    const al = F(nz(2, 5)), be = F(nz(1, 4)), ga = F(nz(2, 5)), de = F(nz(1, 4)), ep = F(nz(2, 6));
    const lhs = rat(Poly.var(u, 1).scale(al), Poly.var(x, 1).scale(be));
    const rhs = ratSub(rat(Poly.var(u, 1).scale(ga).sub(Poly.var(x, 1).scale(de)), Poly.var(x, 1).scale(ep)),
      ratNum(Poly.const(nz(1, 5))));
    return { lhs, rhs, x };
  }
};

function G_subject(o) {
  o = o || {};
  const hard = !!o.hard;
  const names = hard
    ? ['h1', 'h2', 'h3', 'h4', 'h5', 'h6']
    : ['s1', 's2', 's3', 's4', 's5', 's6'];
  for (let attempt = 0; attempt < 60; attempt++) {
    const name = pick(names);
    const vs = pickVars(hard ? 4 : 3);
    const built = SUBJ[name]({ vs });
    const ans = solveFor(built.lhs, built.rhs, built.x);
    if (!ans) continue;
    if (ans.n.isZero()) continue;
    if (isOne(ans.d) && ans.n.isConst()) continue;           // too trivial
    const body = ratToLatex(built.lhs) + ' = ' + ratToLatex(built.rhs);
    const steps = [
      'Clear any fractions by multiplying through by the common denominator.',
      'Collect the terms containing $' + built.x + '$ on one side.',
      'Factorise $' + built.x + '$ out.',
      'Divide to leave $' + built.x + '$ alone: $' + built.x + ' = ' + ratToLatex(ans) + '$'
    ];
    return {
      kind: 'expr', family: 'subject',
      prompt: 'Make $' + built.x + '$ the subject of the formula.',
      body: body, ans: ans, ansTex: ratToLatex(ans),
      hints: [
        'Fractions first: multiply the whole equation by the denominator.',
        'Gather the $' + built.x + '$ terms together, then factorise.'
      ],
      steps: steps
    };
  }
  return null;
}

/* ========================================================================== */
/* 6. word problems with numeric answers                                      */
/* ========================================================================== */
function G_word(o) {
  o = o || {};
  const kind = pick(['bus', 'energy', 'heat', 'paper', 'party', 'hemisphere']);
  const rate = pick([50, 60, 80, 100, 120, 150]);
  const fixed = pick([100, 200, 250, 300, 400]);
  const n = ri(5, 40);
  switch (kind) {
    case 'bus': {
      const P = rate * n - fixed;
      return {
        kind: 'num', family: 'word', ansNum: F(n),
        prompt: 'The income \\$$P$ of the driver of a tour bus is calculated by ' +
          '$P = ' + rate + 'n - ' + fixed + '$, where $n$ is the number of passengers.',
        body: '(b) The driver has an income of \\$$' + P + '$. Find the number of passengers.',
        ans: Poly.const(n), ansTex: String(n),
        hints: ['Substitute $P = ' + P + '$ into the formula.', 'Solve the equation step by step.'],
        steps: ['$' + P + ' = ' + rate + 'n - ' + fixed + '$',
          '$' + rate + 'n = ' + (P + fixed) + '$', '$n = ' + n + '$']
      };
    }
    case 'energy': {
      const v = ri(2, 9);
      const m = ri(10, 80);
      const E = (m * v * v) / 2;
      if (m * v * v % 2) return G_word(o);
      return {
        kind: 'num', family: 'word', ansNum: F(m),
        prompt: 'The kinetic energy $E$ joules of a running person of mass $m$ kg running at $v$ m/s is $E = \\dfrac{mv^{2}}{2}$.',
        body: '(b) A person running at $' + v + '$ m/s has kinetic energy $' + E + '$ J. How heavy is the person?',
        ans: Poly.const(m), ansTex: String(m),
        hints: ['Substitute $E = ' + E + '$ and $v = ' + v + '$.', '$m = \\dfrac{2E}{v^{2}}$.'],
        steps: ['$m = \\dfrac{2E}{v^{2}}$', '$m = \\dfrac{2(' + E + ')}{' + v + '^{2}} = ' + m + '$']
      };
    }
    case 'heat': {
      const m = ri(1, 5), dT = ri(50, 200) * 2, c = ri(400, 900);
      const extra = ri(50, 200);
      const E = m * c * (dT + extra);
      return {
        kind: 'num', family: 'word', ansNum: F(E),
        prompt: 'When a metal block of $m$ kg is heated so that its temperature rises by $T-t$ °C, its internal energy rises by $E$ joules: $E = mc(T-t)$.',
        body: '(b)(i) A $' + m + '$ kg block whose temperature rises by $' + dT + '$ °C gains $' + (m * c * dT) + '$ J. Find $c$.' +
          '\\newline (ii) If the temperature rises a further $' + extra + '$ °C, find the overall increase in internal energy.',
        ans: Poly.const(E), ansTex: String(E),
        hints: ['First use the given rise to find $c$.', 'Then use $T-t = ' + (dT + extra) + '$.'],
        steps: ['$c = \\dfrac{E}{m(T-t)} = \\dfrac{' + (m * c * dT) + '}{' + m + '(' + dT + ')} = ' + c + '$',
          '$E = ' + m + '(' + c + ')(' + (dT + extra) + ') = ' + E + '$']
      };
    }
    case 'paper': {
      const A1 = pick([20, 25, 30, 40]), k = ri(5, 20), base = pick([200, 300, 400, 500]);
      // area is base + k x over x + 7 ; solve (base + kx)/(x+7) = A1
      // x = (base - 7*A1)/(A1 - k)
      const x0 = ri(3, 30);
      const base2 = A1 * (x0 + 7) - k * x0;
      if (A1 === k || base2 <= 0) return G_word(o);
      return {
        kind: 'num', family: 'word', ansNum: F(x0),
        prompt: 'A sheet of paper of area $(' + base2 + ' + ' + k + 'x)$ cm$^{2}$ is cut evenly into $(x+7)$ pieces. Each small piece has area $A$ cm$^{2}$.',
        body: '(a)(i) Express $A$ in terms of $x$.\\newline (ii) Make $x$ the subject of the formula.\\newline (b)(i) If $A = ' + A1 + '$, find $x$.',
        ans: Poly.const(x0), ansTex: String(x0),
        hints: ['$A = \\dfrac{' + base2 + ' + ' + k + 'x}{x+7}$.', 'Then cross-multiply to reach $x$.'],
        steps: ['$A = \\dfrac{' + base2 + ' + ' + k + 'x}{x+7}$',
          '$A(x+7) = ' + base2 + ' + ' + k + 'x$', '$x = \\dfrac{' + base2 + ' - 7A}{A - ' + k + '}$',
          '$x = \\dfrac{' + base2 + ' - 7(' + A1 + ')}{' + A1 + ' - ' + k + '} = ' + x0 + '$']
      };
    }
    case 'party': {
      const k1 = ri(2, 9), per = pick([30, 40, 50, 60]), base1 = pick([100, 200, 300, 500]);
      const m0 = ri(5, 30);
      const E = per * m0 + base1 * k1;
      return {
        kind: 'num', family: 'word', ansNum: F(k1),
        prompt: 'The total expenditure \\$$E$ for a party with $m$ participants is $E = ' + per + 'm + ' + base1 + 'k$, where $k$ is a constant.',
        body: '(a) For $' + m0 + '$ participants the expenditure is \\$$' + E + '$. Find $k$.\\newline (b)(i) Make $m$ the subject.',
        ans: Poly.const(k1), ansTex: String(k1),
        hints: ['Substitute $E = ' + E + '$ and $m = ' + m0 + '$.', 'Then solve for $k$.'],
        steps: ['$' + E + ' = ' + per + '(' + m0 + ') + ' + base1 + 'k$',
          '$' + base1 + 'k = ' + (E - per * m0) + '$', '$k = ' + k1 + '$']
      };
    }
    default: {
      const r = ri(2, 12);
      const A = 3 * r * r;
      const V = (2 * r * r * r) / 3;
      if ((2 * r * r * r) % 3) return G_word(o);
      return {
        kind: 'expr', family: 'word',
        prompt: 'The total surface area $A$ cm$^{2}$ of a hemisphere of radius $r$ cm is $A = 3\\pi r^{2}$, and its volume is $V = \\dfrac{2}{3}\\pi r^{3}$.',
        body: '(a) If $r = ' + r + '$, find $A$, leaving your answer in terms of $\\pi$.',
        ans: rat(Poly.const(A).mul(Poly.var('pi', 1)), Poly.const(1)),
        ansTex: A + '\\pi',
        hints: ['Put $r = ' + r + '$ into $A = 3\\pi r^{2}$.', 'Keep $\\pi$ as a symbol — do not replace it by a number.'],
        steps: ['$A = 3\\pi(' + r + ')^{2}$', '$A = ' + A + '\\pi$']
      };
    }
  }
}

/* ========================================================================== */
/* 7. wrap any generator as a 4-option multiple choice question               */
/* ========================================================================== */
function mutateAST(a) {
  const kinds = ['sign', 'swap', 'coef', 'drop'];
  let tries = 0;
  while (tries++ < 20) {
    const k = pick(kinds);
    const nodes = [];
    (function walk(n, path) {
      nodes.push({ n, path });
      if (n.a) walk(n.a, path.concat('a'));
      if (n.b) walk(n.b, path.concat('b'));
    })(a, []);
    const choice = pick(nodes);
    const clone = deepClone(a);
    let ptr = clone;
    for (const step of choice.path) ptr = ptr[step];
    const target = ptr;
    if (k === 'sign' && (target.k === '+' || target.k === '-')) {
      const src = choice.path.length ? getAt(clone, choice.path.slice(0, -1)) : null;
      // flip + / - by rebuilding
      if (choice.path.length) {
        const parent = getAt(clone, choice.path.slice(0, -1));
        const last = choice.path[choice.path.length - 1];
        if (target.k === '+') parent[last] = { k: '-', a: target.a, b: target.b };
        else parent[last] = { k: '+', a: target.a, b: target.b };
        return clone;
      }
      if (a.k === '+') return { k: '-', a: target.a, b: target.b };
      return { k: '+', a: target.a, b: target.b };
    }
    if (k === 'swap' && ptr.k === '/') {
      ptr.k = '/'; const tmp = ptr.a; ptr.a = ptr.b; ptr.b = tmp;
      return clone;
    }
    if (k === 'coef') {
      if (ptr.k === 'n') { ptr.v = F(pick([2, 3, 4, 5])); return clone; }
      if (ptr.k === '*') {
        for (const q of flattenM(ptr)) if (q.k === 'n') { q.v = F(pick([2, 3, 4])); return clone; }
      }
    }
    if (k === 'drop' && ptr.k === '*') {
      const parts = flattenM(ptr);
      if (parts.length > 1) {
        const idx = pick(parts.map((_, i) => i));
        const left = parts.filter((_, i) => i !== idx).reduce((x, y) => ({ k: '*', a: x, b: y }));
        if (choice.path.length) {
          const parent = getAt(clone, choice.path.slice(0, -1));
          parent[choice.path[choice.path.length - 1]] = left;
        }
        return choice.path.length ? clone : left;
      }
    }
  }
  return null;
}
function flattenM(e) { return e.k === '*' ? [...flattenM(e.a), ...flattenM(e.b)] : [e]; }
function getAt(root, path) { let x = root; for (const p of path) x = x[p]; return x; }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function G_mcq(o) {
  o = o || {};
  const makers = [G_cancel, G_mulDiv, G_addSub, G_subject];
  for (let attempt = 0; attempt < 40; attempt++) {
    const maker = o.from || pick(makers);
    const item = maker(o);
    if (!item || item.kind !== 'expr') continue;
    const base = ratToAST(item.ans);
    const seen = new Set([texAST(base)]);
    const opts = [texAST(base)];
    let guard = 0;
    while (opts.length < 4 && guard++ < 60) {
      const m = mutateAST(base);
      if (!m) continue;
      let t;
      try { t = texAST(m); } catch (e) { continue; }
      if (seen.has(t)) continue;
      // must be genuinely different
      if (sameAST(m, base)) continue;
      seen.add(t);
      opts.push(t);
    }
    if (opts.length < 4) continue;
    const order = shuffle([0, 1, 2, 3]);
    const options = opts.map((_, i) => opts[order[i]]);
    const correct = order.indexOf(0);
    return {
      kind: 'mcq', family: item.family + 'Mcq',
      prompt: item.prompt,
      body: item.body,
      options: options, correct: correct,
      ansTex: opts[0],
      hints: item.hints.slice(0, 1).concat(['Try each option by working it out from scratch.']),
      steps: item.steps
    };
  }
  return G_mcq(o);
}

const FAMILIES = {
  cancel: { hard: [G_cancel, G_cancel], easy: [G_cancel] },
  cancelFactor: [G_cancel],
  mulDiv: [G_mulDiv],
  addSub: [G_addSub],
  subst: [G_subst],
  subject: [G_subject],
  word: [G_word],
  mcqSimplify: [G_mcq],
  mcqSubject: [G_mcq]
};

function genSimilar(family, hard) {
  const o = { hard: !!hard };
  if (family === 'cancelFactor') family = 'cancel';
  const map = {
    cancel: () => G_cancel(o),
    cancelFactor: () => G_cancel(o),
    mulDiv: () => G_mulDiv(o),
    addSub: () => G_addSub(o),
    subst: () => G_subst(o),
    subject: () => G_subject(o),
    word: () => G_word(o),
    change: () => G_word(o),
    bracketSimplify: () => G_mulDiv(o),
    mcqSimplify: () => G_mcq({}),
    mcqSubject: () => G_mcq({ from: G_subject }),
    mcqSubst: () => G_mcq({})
  };
  const f = map[family] || map.cancel;
  for (let i = 0; i < 30; i++) {
    const r = f();
    if (r) return r;
  }
  return G_cancel(o);
}

if (typeof module !== 'undefined') {
  module.exports = {
    G_cancel, G_mulDiv, G_addSub, G_subst, G_subject, G_word, G_mcq, genSimilar,
    linForm, solveFor, fracTex
  };
}

/* ------------------------------------------------- maths rendering ------ */
function hasKatex() { return typeof katex !== 'undefined'; }
function renderRich(el, text) {
  String(text).split('\n').forEach((line, i) => {
    if (i > 0) el.appendChild(document.createElement('br'));
    line.split(/(\*\*[^*]+\*\*|\*[^*\n]+\*|_[^_\n]+_)/g).forEach(seg => {
      if (!seg) return;
      if (seg.startsWith('**') && seg.endsWith('**') && seg.length > 4) {
        el.appendChild(Object.assign(document.createElement('strong'), { textContent: seg.slice(2, -2) }));
      } else if ((seg.startsWith('*') && seg.endsWith('*') && seg.length > 2) ||
                 (seg.startsWith('_') && seg.endsWith('_') && seg.length > 2)) {
        el.appendChild(Object.assign(document.createElement('em'), { textContent: seg.slice(1, -1) }));
      } else el.appendChild(document.createTextNode(seg));
    });
  });
}
function paint(node, src, display) {
  if (hasKatex()) {
    try { katex.render(src, node, { displayMode: !!display, throwOnError: false, strict: 'ignore' }); return; }
    catch (e) { /* fall through */ }
  }
  node.textContent = src;
}
function renderMathInto(el, text) {
  el.innerHTML = '';
  const segs = String(text).split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  for (const seg of segs) {
    if (!seg) continue;
    if (seg.startsWith('$$')) {
      const d = document.createElement('div'); d.className = 'math-display';
      paint(d, seg.slice(2, -2), true); el.appendChild(d);
    } else if (seg.startsWith('$')) {
      const s = document.createElement('span');
      paint(s, seg.slice(1, -1), false); el.appendChild(s);
    } else renderRich(el, seg);
  }
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;

function numToF(ans) {
  const t = String(ans).trim();
  const neg = t.startsWith('-');
  const body = neg ? t.slice(1) : t;
  if (body.includes('/')) { const [a, b] = body.split('/'); return F((neg ? -1 : 1) * Number(a), Number(b)); }
  return F(Number(t));
}
function fromBank(q) {

    kind: q.type,
    opts: q.opts || null,
    expected: q.type === 'expr' ? ratFromExpr(q.ans)
      : q.type === 'num' ? numToF(q.ans)
        : q.type === 'mcq' ? Number(q.ans) : q.ans,
    ansTex: q.ansTex,

function isCorrect(rq, val) {

    if (rq.kind === 'num') return checkNumber(val, rq.expected).ok;
    if (rq.kind === 'yn') return val === rq.expected;
    if (rq.kind === 'mcq') return Number(val) === Number(rq.expected);

}

/* Turn a short LaTeX snippet into readable plain text for list previews,
   e.g. "\frac{ab}{cd}=2 [d]"  ->  "(ab)/(cd) = 2 [d]" */
function texToPlainShort(s) {
  let t = String(s || '');
  t = t.replace(/\s*\$([^$]*)\$\s*/g, ' $1 ');        // unwrap inline maths
  for (let i = 0; i < 8; i++) {                          // \frac{a}{b} -> (a)/(b)
    const m = t.match(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/);
    if (!m) break;
    t = t.slice(0, m.index) + '(' + m[1] + ')/(' + m[2] + ')' + t.slice(m.index + m[0].length);
  }
  t = t.replace(/\\times/g, ' × ').replace(/\\div/g, ' ÷ ')
       .replace(/\\quad/g, '  ')
       .replace(/\\text\s*\{([^{}]*)\}/g, '$1')
       .replace(/\\pi/g, 'π').replace(/\\left|\\right|\\!/g, '')
       .replace(/\\[a-zA-Z]+/g, '')
       .replace(/[\{\}]/g, '')
       .replace(/\s+/g, ' ').trim();
  return t.length > 46 ? t.slice(0, 44) + '…' : t;
}
function shortPreview(q) {
  const src = q.prompt || '';
  return src.replace(/\\text\s*\{[^}]*\}/g, '').replace(/\\quad/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 34);
}

function pickSmart() {

  const skillOrder = Object.keys(SKILLS)
    .filter(k => k.indexOf('Mcq') < 0 || k === 'mcq')
    .map(k => ({ k, acc: (function () { const s = store.skills[k]; return s && s.a >= 2 ? s.c / s.a : 0.75; })() }))
    .sort((a, b) => a.acc - b.acc).map(x => x.k);

  for (const fam of skillOrder) {
    const pool = unsolvedIn(BANK.filter(q => q.fam === fam).map(q => q.id));
